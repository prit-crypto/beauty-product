services:
  - type: web
    name: beauty-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AI_PROVIDER
        value: rule
      - key: AI_REWRITE
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: beauty-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Free services have no private network, so the frontend calls the backend's public URL.
      # API_URL is baked into Next's /api rewrite at build time.
      - key: API_URL
        value: https://beauty-backend-o7m5.onrender.com
